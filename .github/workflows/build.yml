
name: Etherlyzer Package Build

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install built wheel
        run: |
          python -m venv .package-test
          .package-test/bin/python -m pip install dist/*.whl

      - name: Verify installed CLI
        run: |
          .package-test/bin/etherlyzer --help
          .package-test/bin/etherlyzer whois --help
          .package-test/bin/etherlyzer validate --help
          .package-test/bin/etherlyzer inspect --help
          .package-test/bin/etherlyzer format --help
          .package-test/bin/etherlyzer registries --help
          .package-test/bin/etherlyzer sync --help

      - name: Verify source distribution installation
        run: |
          python -m venv .sdist-test
          .sdist-test/bin/python -m pip install dist/*.tar.gz
          .sdist-test/bin/etherlyzer --help

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: etherlyzer-distributions
          path: dist/
          if-no-files-found: error
