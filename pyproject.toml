[project]
name = "etherlyzer"
version = "0.9.3"
description = "Fast offline lookup and classification of Ethernet-related identifiers."
readme = "README.md"
requires-python = ">=3.14,<4"
license = "MIT"

authors = [
    { name = "Tobias Andersen" }
]

keywords = [
    "ethernet",
    "mac-address",
    "oui",
    "ieee",
    "ethertype",
    "networking",
    "cybersecurity",
    "asset-discovery",
    "network-automation",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Topic :: Security",
    "Typing :: Typed",
]

dependencies = [
    "requests>=2.34.2,<3.0.0",
    "python-dotenv>=1.2.4,<2.0.0",
    "platformdirs>=4.12.2,<5.0.0",
    "pandas>=3.0.6,<4.0.0",
    "tqdm>=4.70.1,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/blue-hexagon/EtherLyzer"
Repository = "https://github.com/blue-hexagon/EtherLyzer"
Issues = "https://github.com/blue-hexagon/EtherLyzer/issues"

[project.scripts]
etherlyzer = "etherlyzer.terminal.cli:main"


[tool.poetry]
packages = [
    { include = "etherlyzer", from = "src" }
]
include = [
    { path = "src/etherlyzer/etherlyzer.env", format = ["sdist", "wheel"] }
]


[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.16",
    "mypy>=2.4",
    "pre-commit>=4",
    "bandit>=1.9",
    "pip-audit>=2.10.0",
    "vulture>=2.14",
    "types-toml>=0.10.8.20260518,<0.11.0.0"
]
docs = [
    "sphinx (>=9.1.0,<10.0.0)",
    "furo (>=2025.12.19,<2026.0.0)",
    "myst-parser (>=5.1.0,<6.0.0)",
    "sphinx-copybutton (>=0.5.2,<0.6.0)",
    "sphinx-autobuild (>=2025.8.25,<2026.0.0)",
    "sphinx-design (>=0.7.0,<0.8.0)",
    "sphinxcontrib-mermaid (>=2.1.0,<3.0.0)",
    "sphinx-autodoc-typehints (>=3.13.0,<4.0.0)",
    "sphinx-sitemap (>=2.9.0,<3.0.0)"
]


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: tests involving multiple Etherlyzer components",
    "network: tests requiring external network access",
]


[tool.coverage.run]
branch = true
source = ["etherlyzer"]


[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]


[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

warn_unused_configs = true
warn_unreachable = true
show_error_codes = true
pretty = true


[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "RUF",
]

ignore = [
    "E501",
]


[tool.ruff.lint.isort]
known-first-party = ["etherlyzer"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
